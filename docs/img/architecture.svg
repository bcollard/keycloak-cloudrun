<path d="M560.0,372 L560.0,410" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M442,544 L442,582" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M545,609 L573,609" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M677,634 L677,672" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M442,744 L442,782" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M545,812 L573,812" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M985,468 L985,498" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<text x="993" y="488" font-size="12" fill="#5F6368">push</text>
<path d="M985,556 L985,586" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<text x="993" y="576" font-size="12" fill="#5F6368">pull</text>
<path d="M820,616 L800,616 L800,690 L782,690" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M820,718 L782,718" fill="none" stroke="#5F6368" stroke-width="1.5" marker-end="url(#a)"/>
</svg>