name: Build and Push Keycloak to GHCR

on:
  push:
    branches: [ "main" ]
    paths:
      - "KEYCLOAK_VERSION"
      - "Dockerfile"
      - "server/**"
      - ".github/workflows/build-push.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "KEYCLOAK_VERSION"
      - "Dockerfile"
      - "server/**"
      - ".github/workflows/build-push.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # This will be owner/repo

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.0.2" # optional

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Keycloak version
        run: |
          set -euo pipefail
          if [[ ! -f KEYCLOAK_VERSION ]]; then
            echo "KEYCLOAK_VERSION file not found" >&2
            exit 1
          fi
          VERSION=$(tr -d ' \t\r\n' < KEYCLOAK_VERSION)
          if [[ -z "$VERSION" ]]; then
            echo "KEYCLOAK_VERSION file is empty" >&2
            exit 1
          fi
          echo "KEYCLOAK_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ env.KEYCLOAK_VERSION }},enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=tag
            type=sha

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            KEYCLOAK_VERSION=${{ env.KEYCLOAK_VERSION }}

      # Sign the image digest once (signatures attach to the digest, so every
      # tag is covered). Signing once per tag hit Rekor 409 conflicts on retries.
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
